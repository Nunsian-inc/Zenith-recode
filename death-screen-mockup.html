<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Zenith — кастомный экран смерти (мокап)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    background: #05060a;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* ==== «Игровой мир» позади (имитация заблюренного скрина) ==== */
  .world { position: absolute; inset: 0; overflow: hidden; }
  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #0b1526 0%, #14263f 45%, #1d3a2f 72%, #243b25 100%);
  }
  .b { position: absolute; filter: blur(14px); opacity: .85; }
  .p1 { width: 340px; height: 90px; left: 4%;  bottom: 6%;  background: #2e4d2b; transform: rotate(-2deg); }
  .p2 { width: 260px; height: 130px; left: 22%; bottom: 2%;  background: #22401f; transform: rotate(1.5deg); }
  .p3 { width: 300px; height: 70px;  left: 38%; bottom: 10%; background: #3a5a35; transform: rotate(-1deg); }
  .p4 { width: 420px; height: 120px; left: 52%; bottom: 1%;  background: #274a26; transform: rotate(2deg); }
  .p5 { width: 260px; height: 150px; left: 72%; bottom: 3%;  background: #1f3a20; transform: rotate(-1.5deg); }
  .p6 { width: 200px; height: 90px;  left: 88%; bottom: 8%;  background: #35532f; transform: rotate(1deg); }
  .s1 { width: 500px; height: 300px; left: -6%; bottom: 14%; background: #16351e; border-radius: 40%; }
  .s2 { width: 560px; height: 360px; left: 48%; bottom: 12%; background: #17371d; border-radius: 45%; }
  .torch { position: absolute; width: 6px; height: 6px; border-radius: 50%;
           background: #ffce6b; box-shadow: 0 0 30px 14px rgba(255,180,80,.35); filter: blur(2px); }
  .t1 { left: 31%; bottom: 26%; } .t2 { left: 63%; bottom: 22%; } .t3 { left: 78%; bottom: 30%; }

  /* красный ванильный тинт смерти */
  .redtint { position: absolute; inset: 0; background: rgba(120, 30, 30, .16); }
  /* виньетка */
  .vignette { position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(2,3,6,.55) 100%); }

  /* лёгкие частицы */
  .dust { position: absolute; width: 3px; height: 3px; border-radius: 50%;
          background: rgba(255,255,255,.35); filter: blur(1px); }

  /* ==== Карточка ==== */
  .card {
    position: relative; width: 480px; padding: 30px 34px 24px;
    background: rgba(14,14,16,.78);
    border: 1px solid rgba(255,255,255,.055);
    border-radius: 14px;
    box-shadow:
      0 24px 80px rgba(0,0,0,.6),
      0 0 90px rgba(166,178,255,.07),
      inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(18px);
    color: #fff;
    z-index: 5;
  }
  .glowline {
    position: absolute; top: 0; left: 34px; right: 34px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(166,178,255,.55), transparent);
  }

  .head { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .heart {
    width: 46px; height: 46px; border-radius: 13px;
    background: rgba(255,151,160,.10);
    border: 1px solid rgba(255,151,160,.22);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 26px rgba(255,151,160,.22);
  }
  .heart svg { width: 24px; height: 24px; fill: #FF97A0; }

  h1 { font-size: 30px; font-weight: 800; letter-spacing: .5px; }
  .sub { font-size: 14.5px; color: rgba(255,255,255,.72); font-weight: 500; }

  .killer { margin-top: 22px; text-align: center; }
  .killer .label { font-size: 12px; color: rgba(255,255,255,.48);
                  text-transform: uppercase; letter-spacing: 1.8px; font-weight: 700; }
  .killer .name { margin-top: 6px; font-size: 21px; font-weight: 800;
                  color: #A6B2FF; text-shadow: 0 0 24px rgba(166,178,255,.45); }
  .killer .weapon {
    margin-top: 10px; display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: rgba(255,255,255,.8); font-weight: 600;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07);
    padding: 7px 14px; border-radius: 9px;
  }
  .killer .weapon svg { width: 15px; height: 15px; }

  /* сетка статов */
  .stats {
    margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .stat {
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.045);
    border-radius: 10px; padding: 11px 14px;
  }
  .stat .k { font-size: 11px; color: rgba(255,255,255,.45); font-weight: 700;
             letter-spacing: .8px; text-transform: uppercase; }
  .stat .v { margin-top: 4px; font-size: 15px; font-weight: 700; color: rgba(255,255,255,.92); }
  .stat .v.mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 13.5px; letter-spacing: .3px; }
  .stat .v.accent { color: #C7CEFF; }

  /* кнопки */
  .btns { margin-top: 24px; display: flex; flex-direction: column; gap: 9px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 48px; border-radius: 11px;
    font-family: inherit; font-size: 14.5px; font-weight: 700;
    cursor: pointer; transition: .15s;
    user-select: none;
  }
  .btn-primary {
    background: linear-gradient(180deg, #B7C1FF, #A6B2FF);
    color: #101014;
    box-shadow: 0 6px 26px rgba(166,178,255,.35), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .btn-primary .kbd {
    font-size: 11px; font-weight: 800; color: #4c5580;
    background: rgba(16,16,20,.14); border: 1px solid rgba(16,16,20,.18);
    padding: 2px 7px; border-radius: 5px;
  }
  .btn-ghost {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    color: rgba(255,255,255,.85);
  }
  .btn-ghost .kbd {
    font-size: 11px; font-weight: 700; color: rgba(255,255,255,.4);
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09);
    padding: 2px 7px; border-radius: 5px;
  }

  .copyrow { margin-top: 14px; display: flex; justify-content: center; }
  .copy {
    font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.5);
    cursor: pointer; display: inline-flex; gap: 7px; align-items: center;
  }
  .copy svg { width: 13px; height: 13px; fill: rgba(255,255,255,.4); }

  .footer {
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,.05);
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%;
                background: #A6B2FF; box-shadow: 0 0 12px rgba(166,178,255,.8); }
  .brand span { font-size: 12px; font-weight: 800; letter-spacing: 2.5px; color: rgba(255,255,255,.65); }
  .footer .meta { font-size: 12px; color: rgba(255,255,255,.4); font-weight: 600; }
</style>
</head>
<body>
  <div class="world">
    <div class="sky"></div>
    <div class="b s1"></div><div class="b s2"></div>
    <div class="b p1"></div><div class="b p2"></div><div class="b p3"></div>
    <div class="b p4"></div><div class="b p5"></div><div class="b p6"></div>
    <div class="torch t1"></div><div class="torch t2"></div><div class="torch t3"></div>
    <div class="dust" style="left:12%;top:30%"></div>
    <div class="dust" style="left:78%;top:22%"></div>
    <div class="dust" style="left:64%;top:44%"></div>
    <div class="dust" style="left:28%;top:58%"></div>
  </div>
  <div class="redtint"></div>
  <div class="vignette"></div>

  <div class="card">
    <div class="glowline"></div>

    <div class="head">
      <div class="heart">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </div>
      <div>
        <h1>Вы погибли</h1>
      </div>
      <div class="sub">Ваш тотем не спасёт — за дело</div>
    </div>

    <div class="killer">
      <div class="label">Вас убил</div>
      <div class="name">Xeha_LP</div>
      <div class="weapon">
        <svg viewBox="0 0 24 24" fill="rgba(255,255,255,.75)"><path d="M6.92 5L5 6.92 19.5 21.42l1.92-1.92L6.92 5zM3 9l2-2 4 4-2 2-4-4zm14.5-4.5L15 3l-3.5 3.5 2.5 1.5L19 12l1.5-2.5L17.5 4.5z"/></svg>
        Алмазный меч · Острота V
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">Координаты</div><div class="v mono">1024 / 71 / -512</div></div>
      <div class="stat"><div class="k">Сервер</div><div class="v">HolyWorld · Анархия</div></div>
      <div class="stat"><div class="k">Урон за бой</div><div class="v accent">19.5 ❤</div></div>
      <div class="stat"><div class="k">Серия ударов</div><div class="v">8</div></div>
    </div>

    <div class="btns">
      <div class="btn btn-primary">Возродиться <span class="kbd">Enter</span></div>
      <div class="btn btn-ghost">К месту смерти <span class="kbd">TP</span></div>
      <div class="btn btn-ghost">Главное меню</div>
    </div>

    <div class="copyrow">
      <div class="copy">
        <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
        Скопировать координаты
      </div>
    </div>

    <div class="footer">
      <div class="brand"><div class="dot"></div><span>ZENITH</span></div>
      <div class="meta">14:32 · 26.3</div>
    </div>
  </div>
</body>
</html>
